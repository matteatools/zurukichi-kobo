iv><small>動いている途中でも変更できます。実時間の測定は通常で。</small></div></div></div></div>
</div></main><dialog id="stagesDialog" aria-labelledby="stagesTitle"><h2 id="stagesTitle">途中のお知らせ</h2><div id="pointRows"></div><button type="button" id="addPoint" aria-label="お知らせを追加（最大6つ）">＋</button><p id="pointsMessage" role="status"></p><div class="stage-footer"><button type="button" id="cancelPoints">キャンセル</button><button type="button" id="savePoints">適用</button></div></dialog><script>const engine=(()=>{
function createTimer(seconds=300){return{configured:seconds*1000,remaining:seconds*1000,running:false,deadline:null};}
function remaining(t,now){return t.running?Math.max(0,t.rateAnchor!=null?t.remaining-(now-t.rateAnchor)*(t.rate||1):t.deadline-now):t.remaining;}
function tick(t,now){if(t.running&&remaining(t,now)===0)return{...t,running:false,remaining:0,deadline:null};return t;}
function start(t,now){if(t.running)return t;const ms=t.remaining>0?t.remaining:t.configured;if(ms<=0)return t;return{...t,remaining:ms,running:true,deadline:now+ms/(t.rate||1),...(t.rate?{rateAnchor:now}:{})};}
function stop(t,now){if(!t.running)return t;return{...t,remaining:remaining(t,now),running:false,deadline:null};}
function configure(t,minutes,seconds){if(t.running)return t;return {...createTimer(clamp(minutes,99)*60+clamp(seconds,59)),...(t.rate?{rate:t.rate}:{})};}
function clamp(v,max){return Math.min(max,Math.max(0,Math.trunc(Number(v)||0)));}
function formatted(t,now){const s=Math.ceil(remaining(t,now)/1000);return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function progress(t,now){return t.configured>0?Math.min(1,Math.max(0,remaining(t,now)/t.configured)):0;}

function ovalPath(ratio){const r=Math.max(0,Math.min(1,ratio));if(r<=0)return '';if(r>=1)return 'M 295 -103 A 393 193 0 1 0 295 283 A 393 193 0 1 0 295 -103';const a=2*Math.PI*r,x=295-393*Math.sin(a),y=90-193*Math.cos(a);return `M 295 -103 A 393 193 0 ${r>.5?1:0} 0 ${x.toFixed(4)} ${y.toFixed(4)}`;}

function createWatch(){return{elapsed:0,running:false,anchor:null};}
function watchElapsed(w,now){return w.elapsed+(w.running?Math.max(0,now-w.anchor)*(w.rate||1):0);}
function startWatch(w,now){return w.running?w:{...w,running:true,anchor:now};}

const recordingBuffers=new Map(),recordingLoads=new Map();
function loadEndRecording(id){
 if(recordingBuffers.has(id))return Promise.resolve(recordingBuffers.get(id));
 if(!audio||!END_RECORDINGS[id]||!audio.decodeAudioData)return Promise.resolve(null);
 if(!recordingLoads.has(id)){
  const bytes=Uint8Array.from(atob(END_RECORDINGS[id]),c=>c.charCodeAt(0));
  const loading=audio.decodeAudioData(bytes.buffer).then(buffer=>{recordingBuffers.set(id,buffer);return buffer;}).catch(()=>null);
  recordingLoads.set(id,loading);
 }return recordingLoads.get(id);
}
function playEndRecording(buffer,ticket){
 if(ticket!==audioRequest||!audio||audio.state!=='running')return false;
 try{const source=audio.createBufferSource(),gain=audio.createGain();source.buffer=buffer;gain.gain.value=.85;source.connect(gain);gain.connect(audio.destination);activeEndSounds.add(source);source.onended=()=>{activeEndSounds.delete(source);source.disconnect();gain.disconnect();};source.start();return true;}catch{return false;}
}

function stopEndSound(){for(const node of activeEndSounds){try{node.stop();}catch{}}activeEndSounds.clear();}
function playSoundPattern(pattern,ticket,trackEnd=false){
 if(!audio)return false;
 if(audio.state!=='running'){audio.resume().then(()=>{if(ticket===audioRequest&&audio.state==='running')playSoundPattern(pattern,ticket,trackEnd);}).catch(()=>{});return false;}
 try{const t=audio.currentTime;for(const[f,offset,length,peak=.10,wave='sine']of pattern){
  const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;o.type=wave;
  if(trackEnd&&wave==='square'){g.gain.setValueAtTime(0,t+offset);g.gain.linearRampToValueAtTime(peak,t+offset+.004);g.gain.setValueAtTime(peak,t+offset+length-.012);g.gain.linearRampToValueAtTime(0,t+offset+length);}else{g.gain.setValueAtTime(0,t+offset);g.gain.linearRampToValueAtTime(peak,t+offset+.02);g.gain.exponentialRampToValueAtTime(.001,t+offset+length);}
  if(trackEnd){activeEndSounds.add(o);o.onended=()=>activeEndSounds.delete(o);}
  o.start(t+offset);o.stop(t+offset+length+.02);
 }return true;}catch{return false;}
}
function notifySound(ticket=++audioRequest,type=1){return playSoundPattern(SOUND_PATTERNS[type-1]||SOUND_PATTERNS[0],ticket);}
function notifyEndSound(ticket=++audioRequest,type=endSoundType){
 stopEndSound();const sound=END_SOUNDS.find(sound=>sound.id===type)||END_SOUNDS[0];

}
