<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="黒い背景と白い数字の、シンプルなカウントダウンタイマー。"><title>ズル吉タイマー</title><link rel="stylesheet" href="style.css"></head>
<body><main aria-label="カウントダウンタイマー">
<output id="time" aria-label="残り5分0秒"><svg id="clock" viewBox="-115 -120 820 420" aria-hidden="true"><path id="progress" d="M 295 -103 A 393 193 0 1 0 295 283 A 393 193 0 1 0 295 -103"/><g id="digits"></g><text id="stageLabel" x="295" y="190" text-anchor="middle" style="display:none"></text></svg></output>
<div class="controls">
<div id="timeSettings" class="settings" aria-label="時間の設定">
<div class="stepper"><button type="button" id="minuteMinus" aria-label="1分減らす">−</button><label><input id="minutes" type="number" inputmode="numeric" min="0" max="99" step="1" value="5" aria-label="分"><span>分</span></label><button type="button" id="minutePlus" aria-label="1分増やす">＋</button></div>
<div class="stepper"><button type="button" id="secondMinus" aria-label="1秒減らす">−</button><label><input id="seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" aria-label="秒"><span>秒</span></label><button type="button" id="secondPlus" aria-label="1秒増やす">＋</button></div>
</div>
<div class="actions"><button type="button" id="start">スタート</button><button type="button" id="stop" disabled>ストップ</button><div class="menu-wrap"><button type="button" id="menuButton" aria-label="タイマーのメニュー" aria-expanded="false" aria-controls="fontMenu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div id="fontMenu" role="group" aria-label="タイマーの設定" hidden><div class="menu-header"><span>メニュー</span><button type="button" id="closeMenu" aria-label="メニューを閉じる">閉じる ×</button></div><div class="mode-options"><button type="button" id="countdownMode" aria-pressed="true">タイマー</button><button type="button" id="stopwatchMode" aria-pressed="false">ストップウォッチ</button></div><label class="centi-option"><input id="centiseconds" type="checkbox">1/100秒を表示</label><button type="button" id="resetWatch" hidden>0に戻す</button><label class="centi-option"><input id="showCircle" type="checkbox" checked>円を表示</label><button type="button" id="reverseColors" aria-pressed="false">白黒反転</button><button type="button" id="openProjection">投影画面を開く</button><small id="projectionNote">PCの表示を「拡張」にして、開いた画面を投影先へ移動してください。</small><button type="button" id="openStages">途中のお知らせ</button><div class="menu-divider"></div><button type="button" data-font="simple" aria-pressed="true">シンプル</button><button type="button" data-font="cute" aria-pressed="false">かわいい</button><button type="button" data-font="stylish" aria-pressed="false">おしゃれ</button><button type="button" data-font="heavy" aria-pressed="false">極太</button><button type="button" data-font="party" aria-pressed="false">パーティ</button><div id="countdownOptions" class="countdown-options"><h3>ズル機能</h3><div class="rate-buttons" role="group" aria-label="進む速さ"><button type="button" id="rateSlow" aria-label="少し遅く（0.9倍）" aria-pressed="false">少し遅く<span>（0.9倍）</span></button><button type="button" id="rateNormal" aria-pressed="true">通常</button><button type="button" id="rateFast" aria-label="少し速く（1.1倍）" aria-pressed="false">少し速く<span>（1.1倍）</span></button></div><div id="timeAdjustments"><h4>おかわり・お減らし</h4><div class="adjustment-grid"><button type="button" id="add10s" aria-label="10秒増やす">＋10秒</button><button type="button" id="subtract10s" aria-label="10秒減らす">−10秒</button><button type="button" id="add30s" aria-label="30秒増やす">＋30秒</button><button type="button" id="subtract30s" aria-label="30秒減らす">−30秒</button><button type="button" id="add1m" aria-label="1分増やす">＋1分</button><button type="button" id="subtract1m" aria-label="1分減らす">−1分</button><button type="button" id="add3m" aria-label="3分増やす">＋3分</button><button type="button" id="subtract3m" aria-label="3分減らす">−3分</button><button type="button" id="add5m" aria-label="5分増やす">＋5分</button><button type="button" id="subtract5m" aria-label="5分減らす">−5分</button></div><small>動かしたまま残り時間を調整。合計は99分59秒まで。0になったら停止します。</small></div><div id="countdownHide"><label><input type="checkbox" id="hideEnabled">数字を隠す</label><div id="hideSettings" hidden><label>開始 <input id="hideAfter" type="number" min="0" max="99" step="1" value="1" aria-label="隠し始める開始後の分"> 分後から</label><label>終了 <input id="hideBefore" type="number" min="0" max="99" step="1" value="1" aria-label="表示に戻す終了前の分"> 分前まで</label><small id="hideNote"></small></div></div><small>動いている途中でも変更できます。実時間の測定は通常で。</small></div></div></div></div>
</div></main><dialog id="stagesDialog" aria-labelledby="stagesTitle"><h2 id="stagesTitle">途中のお知らせ</h2><div id="pointRows"></div><button type="button" id="addPoint" aria-label="お知らせを追加（最大6つ）">＋</button><p id="pointsMessage" role="status"></p><div class="stage-footer"><button type="button" id="cancelPoints">キャンセル</button><button type="button" id="savePoints">適用</button></div></dialog><script type="module" src="app.js"></script><script type="module" src="projection-controller.js"></script></body></html>
